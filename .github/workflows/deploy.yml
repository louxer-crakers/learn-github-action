name: Build and Push Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository/code
        uses: actions/checkout@v4

      - name: Dockerhub Login
        run: |
          echo "${{ secrets.TOKEN }}"  | docker login -u louxercr --password-stdin

      - name: Docker build
        run: |
          docker build -t louxercr/test-cicd:${{GITHUB_SHA}} .

      - name: Docker push
        run: |
          docker push louxercr/test-cicd:${{GITHUB_SHA}}