name: Build and Push Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: test-cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository/code
        uses: actions/checkout@v4

      - name: Dockerhub Login
        run: |
          echo "${{ secrets.TOKEN }}"  | docker login -u louxercr --password-stdin

      - name: Docker build
        run: |
          docker build -t louxercr/${{env.IMAGE_NAME}}:${GITHUB_SHA} \
          -t louxercr/${{env.IMAGE_NAME}}:latest .

      - name: Docker push
        run: |
          docker push louxercr/${{env.IMAGE_NAME}}:${GITHUB_SHA}
          docker push louxercr/${{env.IMAGE_NAME}}:latest